<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { width: 260px; padding: 16px; background-color: #1f2328; color: #f0f6fc; font-size: 13px; user-select: none; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        .title { font-weight: 600; font-size: 14px; color: #58a6ff; }
        .switch-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #30363d; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #238636; }
        input:checked + .slider:before { transform: translateX(20px); }
        .control-group { margin-bottom: 12px; }
        .control-label { display: flex; justify-content: space-between; margin-bottom: 4px; color: #8b949e; font-size: 12px; }
        input[type=range] { width: 100%; height: 4px; background: #30363d; border-radius: 2px; -webkit-appearance: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #58a6ff; cursor: pointer; }
        .footer { margin-top: 14px; text-align: center; color: #8b949e; font-size: 11px; }
    </style>
</head>
<body>
    <div class="header">
        <span class="title">🌙 Dark Reader 护眼</span>
        <span id="status-text" style="font-size:12px; color:#8b949e;">未开启</span>
    </div>
    <div class="switch-row">
        <span>深色护眼开关</span>
        <label class="switch">
            <input type="checkbox" id="toggle-enable">
            <span class="slider"></span>
        </label>
    </div>
    <div class="control-group">
        <div class="control-label"><span>亮度</span><span id="val-brightness">100%</span></div>
        <input type="range" id="slider-brightness" min="50" max="150" value="100">
    </div>
    <div class="control-group">
        <div class="control-label"><span>对比度</span><span id="val-contrast">100%</span></div>
        <input type="range" id="slider-contrast" min="50" max="150" value="100">
    </div>
    <div class="footer">MIT 开源 | 实时纯前端渲染</div>
    <script src="popup.js"></script>
</body>
</html>
