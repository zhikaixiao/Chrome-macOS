name: macOS Web VNC Remote Desktop

on:
  workflow_dispatch:

jobs:
  macos-vnc:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 1. Setup macOS System Password & VNC Screen Sharing
        run: |
          echo "=== 1. 设置系统 runner 用户密码 ==="
          sudo dscl . -passwd /Users/runner 123456 || true
          
          echo "=== 2. 开启 macOS 原生屏幕共享与 Legacy VNC 模式 ==="
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -allowAccessFor -allUsers -privs -all
            
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes
            
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvncmode 2 -vncpassword 123456
            
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -restart -agent -console
          
          echo "✓ macOS VNC Legacy 模式已就绪 (密码: 123456)"

      - name: 2. Setup Web-based noVNC & Cloudflare Tunnel
        run: |
          echo "=== 配置 noVNC 网页客户端 ==="
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc
          
          # 启动 noVNC 代理 (设置默认只请求 VNC 密码)
          /tmp/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 &
          sleep 3
          
          echo "=== 下载并启动 Cloudflare Tunnel ==="
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            CF_URL="https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz"
          else
            CF_URL="https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-amd64.tgz"
          fi
          
          curl -sL "$CF_URL" -o /tmp/cloudflared.tgz
          tar -xzf /tmp/cloudflared.tgz -C /tmp/
          chmod +x /tmp/cloudflared
          
          /tmp/cloudflared tunnel --url http://localhost:6080 > /tmp/tunnel.log 2>&1 &
          
          echo "正在生成公网安全访问链接..."
          TUNNEL_URL=""
          for i in {1..40}; do
            TUNNEL_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/tunnel.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 2
          done
          
          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Cloudflare 日志内容如下:"
            cat /tmp/tunnel.log
            exit 1
          fi

          echo ""
          echo "================================================================================"
          echo "🎉 您的 macOS 云端真机远程桌面已成功创建！"
          echo "================================================================================"
          echo "🔗 网页远程桌面访问地址: ${TUNNEL_URL}/vnc.html?autoconnect=true&password=123456"
          echo "🔑 密码: 123456"
          echo "================================================================================"
          echo "💡 使用指南:"
          echo "  1. 复制上面的链接直接在浏览器打开 (已配置自动输入密码和连接)。"
          echo "  2. 桌面打开终端，进入当前工程目录: cd \$GITHUB_WORKSPACE/Chrome-macOS"
          echo "  3. 运行 ./一键安装配置.command 和 ./启动Chrome.command 亲自体验！"
          echo "================================================================================"
          echo ""

      - name: 3. Keep Alive for 30 Minutes
        run: |
          echo "macOS 远程桌面正在保持运行中（有效时长 30 分钟）..."
          echo "测试完毕后，您可以随时在 GitHub 页面点击 'Cancel workflow' 结束运行。"
          sleep 1800
