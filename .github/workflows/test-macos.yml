name: Test macOS Chrome Portable (Enhanced & Clean)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-dual-editions:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 1. Setup Shell Permissions
        run: |
          chmod +x Chrome-macOS/*.command Chrome-macOS/Installer/*.sh Chrome-macOS/App/*.sh Chrome-macOS/App/Tools/*.sh

      - name: 2. Test Package Compliance Audit
        run: |
          ./Chrome-macOS/App/Tools/verify-package.sh

      - name: 3. Test One-Click Installer from Root Directory
        run: |
          test -f "Chrome-macOS/一键安装配置.command"
          test -f "Chrome-macOS/Installer.command"
          test -f "Chrome-macOS/Installer/setup-chrome.sh"
          ./Chrome-macOS/一键安装配置.command --silent

      - name: 4. Verify Apple codesign Digital Signature (Google LLC EQHXZ8M8AV)
        run: |
          CHROME_APP="Chrome-macOS/App/Chrome-bin/Google Chrome.app"
          test -d "$CHROME_APP"
          codesign --verify --deep --strict --verbose=2 "$CHROME_APP"
          codesign -dv --verbose=4 "$CHROME_APP" 2>&1 | grep "EQHXZ8M8AV"
          echo "✓ Google LLC 官方开发者证书验证 100% 通过！"

      - name: 5. Test [Enhanced Edition] Launch from Root Directory
        run: |
          echo "=== 测试根目录【启动Chrome.command】(增强插件版) ==="
          ./Chrome-macOS/启动Chrome.command --version
          test -d "Chrome-macOS/App/Extensions/DarkReader"
          test -d "Chrome-macOS/App/Extensions/KissTranslator"
          test -d "Chrome-macOS/App/Extensions/Violentmonkey"
          echo "✓ 增强插件版启动与扩展挂载 100% 成功！"

      - name: 6. Test [Clean Edition] Launch (0 Extensions, Pure Chrome)
        run: |
          echo "=== 测试【纯净无插件版】启动 ==="
          CLEAN_TEST_DIR="/tmp/Chrome-Clean-Test"
          mkdir -p "$CLEAN_TEST_DIR"
          cp -R Chrome-macOS/* "$CLEAN_TEST_DIR/"
          rm -rf "$CLEAN_TEST_DIR/App/Extensions/"*
          
          "$CLEAN_TEST_DIR/启动Chrome.command" --version
          test -d "$CLEAN_TEST_DIR/Data/UserData"
          echo "✓ 纯净无插件版启动与数据隔离 100% 成功！"

      - name: 7. Test Compliance Report Generation
        run: |
          ./Chrome-macOS/App/Tools/generate-compliance-report.sh
          test -f "合规证明与安全审计报告.html"
          echo "✓ 安全与合规审计报告生成 100% 成功！"
