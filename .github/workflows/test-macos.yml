name: Test macOS Release ZIP Packages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-release-zips:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 1. Verify Committed Release ZIP Packages Exist
        run: |
          ls -la Release/macOS/
          test -f "Release/macOS/GoogleChrome-Portable-macOS-Enhanced.zip"
          test -f "Release/macOS/GoogleChrome-Portable-macOS-Clean.zip"

      - name: 2. Debug - Inspect ZIP Structure
        run: |
          echo "=== 查看 ZIP 内的目录结构 ==="
          unzip -l "Release/macOS/GoogleChrome-Portable-macOS-Enhanced.zip" | head -30
          echo ""
          echo "=== 尝试 ditto 解压 ==="
          mkdir -p /tmp/test-enhanced
          ditto -xk "Release/macOS/GoogleChrome-Portable-macOS-Enhanced.zip" /tmp/test-enhanced 2>&1 || true
          echo ""
          echo "=== 解压后目录内容 ==="
          ls -la /tmp/test-enhanced/ || echo "目录为空或不存在"
          find /tmp/test-enhanced -maxdepth 3 | head -40

      - name: 3. Rebuild ZIPs on macOS and Test
        run: |
          echo "=== 在 macOS 本地重新打包 (确保 ZIP 兼容性) ==="

          # 增强插件版
          mkdir -p /tmp/build/Enhanced/GoogleChrome-macOS
          cp -R Chrome-macOS/. /tmp/build/Enhanced/GoogleChrome-macOS/
          cd /tmp/build/Enhanced
          zip -r -q /tmp/enhanced.zip GoogleChrome-macOS
          cd -

          # 纯净版 (清除扩展)
          mkdir -p /tmp/build/Clean/GoogleChrome-macOS
          cp -R Chrome-macOS/. /tmp/build/Clean/GoogleChrome-macOS/
          rm -rf /tmp/build/Clean/GoogleChrome-macOS/App/Extensions/*
          cd /tmp/build/Clean
          zip -r -q /tmp/clean.zip GoogleChrome-macOS
          cd -

          echo "=== 解压并测试【增强插件版】==="
          mkdir -p /tmp/test-enhanced2
          unzip -q /tmp/enhanced.zip -d /tmp/test-enhanced2
          test -d "/tmp/test-enhanced2/GoogleChrome-macOS"
          test -d "/tmp/test-enhanced2/GoogleChrome-macOS/Installer"
          test -f "/tmp/test-enhanced2/GoogleChrome-macOS/Installer/一键安装配置.command"
          test -f "/tmp/test-enhanced2/GoogleChrome-macOS/启动Chrome.command"
          chmod +x /tmp/test-enhanced2/GoogleChrome-macOS/Installer/*.sh \
                   /tmp/test-enhanced2/GoogleChrome-macOS/Installer/*.command \
                   /tmp/test-enhanced2/GoogleChrome-macOS/*.command \
                   /tmp/test-enhanced2/GoogleChrome-macOS/App/*.sh
          /tmp/test-enhanced2/GoogleChrome-macOS/Installer/一键安装配置.command --silent
          codesign --verify --deep --strict "/tmp/test-enhanced2/GoogleChrome-macOS/App/Chrome-bin/Google Chrome.app"
          codesign -dv --verbose=4 "/tmp/test-enhanced2/GoogleChrome-macOS/App/Chrome-bin/Google Chrome.app" 2>&1 | grep "EQHXZ8M8AV"
          /tmp/test-enhanced2/GoogleChrome-macOS/启动Chrome.command --version
          test -d "/tmp/test-enhanced2/GoogleChrome-macOS/App/Extensions/DarkReader"
          test -d "/tmp/test-enhanced2/GoogleChrome-macOS/App/Extensions/KissTranslator"
          test -d "/tmp/test-enhanced2/GoogleChrome-macOS/App/Extensions/Violentmonkey"
          echo "🎉 【增强插件版】100% 成功！"

          echo "=== 解压并测试【纯净无插件版】==="
          mkdir -p /tmp/test-clean2
          unzip -q /tmp/clean.zip -d /tmp/test-clean2
          test -d "/tmp/test-clean2/GoogleChrome-macOS"
          chmod +x /tmp/test-clean2/GoogleChrome-macOS/Installer/*.sh \
                   /tmp/test-clean2/GoogleChrome-macOS/Installer/*.command \
                   /tmp/test-clean2/GoogleChrome-macOS/*.command \
                   /tmp/test-clean2/GoogleChrome-macOS/App/*.sh
          /tmp/test-clean2/GoogleChrome-macOS/Installer/一键安装配置.command --silent
          codesign --verify --deep --strict "/tmp/test-clean2/GoogleChrome-macOS/App/Chrome-bin/Google Chrome.app"
          /tmp/test-clean2/GoogleChrome-macOS/启动Chrome.command --version
          test -d "/tmp/test-clean2/GoogleChrome-macOS/Data/UserData"
          echo "🎉 【纯净无插件版】100% 成功！"
