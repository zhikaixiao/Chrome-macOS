name: Test macOS Release ZIP Packages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-release-zips:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 1. Build Both Release ZIP Packages
        run: |
          echo "=== 打包增强版与纯净版 ZIP ==="
          pwsh ./package_release_macos.ps1
          ls -la Release/macOS/

      - name: 2. Test Unzipping & Running [Enhanced Edition ZIP]
        run: |
          echo "=== 1. 解压【增强插件版】ZIP ==="
          mkdir -p /tmp/test-enhanced
          unzip -q "Release/macOS/GoogleChrome-Portable-macOS-Enhanced.zip" -d /tmp/test-enhanced
          
          echo "=== 2. 检查解压出的目录结构 (验证单一根目录 GoogleChrome-macOS) ==="
          test -d "/tmp/test-enhanced/GoogleChrome-macOS"
          test -d "/tmp/test-enhanced/GoogleChrome-macOS/Installer"
          test -f "/tmp/test-enhanced/GoogleChrome-macOS/Installer/一键安装配置.command"
          test -f "/tmp/test-enhanced/GoogleChrome-macOS/启动Chrome.command"
          
          echo "=== 3. 赋予执行权限并运行 Installer 脚本 ==="
          chmod +x /tmp/test-enhanced/GoogleChrome-macOS/Installer/*.command \
                   /tmp/test-enhanced/GoogleChrome-macOS/Installer/*.sh \
                   /tmp/test-enhanced/GoogleChrome-macOS/*.command \
                   /tmp/test-enhanced/GoogleChrome-macOS/App/*.sh
          
          /tmp/test-enhanced/GoogleChrome-macOS/Installer/一键安装配置.command --silent
          
          echo "=== 4. 验证 codesign 签名与启动 Chrome ==="
          codesign --verify --deep --strict --verbose=2 "/tmp/test-enhanced/GoogleChrome-macOS/App/Chrome-bin/Google Chrome.app"
          /tmp/test-enhanced/GoogleChrome-macOS/启动Chrome.command --version
          
          echo "=== 5. 验证 3 款预装扩展 ==="
          test -d "/tmp/test-enhanced/GoogleChrome-macOS/App/Extensions/DarkReader"
          test -d "/tmp/test-enhanced/GoogleChrome-macOS/App/Extensions/KissTranslator"
          test -d "/tmp/test-enhanced/GoogleChrome-macOS/App/Extensions/Violentmonkey"
          echo "🎉 【增强插件版 ZIP】解压、安装与启动 100% 成功！"

      - name: 3. Test Unzipping & Running [Clean Edition ZIP]
        run: |
          echo "=== 1. 解压【纯净无插件版】ZIP ==="
          mkdir -p /tmp/test-clean
          unzip -q "Release/macOS/GoogleChrome-Portable-macOS-Clean.zip" -d /tmp/test-clean
          
          echo "=== 2. 检查解压出的目录结构 ==="
          test -d "/tmp/test-clean/GoogleChrome-macOS"
          test -d "/tmp/test-clean/GoogleChrome-macOS/Installer"
          test -f "/tmp/test-clean/GoogleChrome-macOS/Installer/一键安装配置.command"
          test -f "/tmp/test-clean/GoogleChrome-macOS/启动Chrome.command"
          
          echo "=== 3. 赋予执行权限并运行 Installer 脚本 ==="
          chmod +x /tmp/test-clean/GoogleChrome-macOS/Installer/*.command \
                   /tmp/test-clean/GoogleChrome-macOS/Installer/*.sh \
                   /tmp/test-clean/GoogleChrome-macOS/*.command \
                   /tmp/test-clean/GoogleChrome-macOS/App/*.sh
          
          /tmp/test-clean/GoogleChrome-macOS/Installer/一键安装配置.command --silent
          
          echo "=== 4. 验证 codesign 签名与启动 Chrome ==="
          codesign --verify --deep --strict --verbose=2 "/tmp/test-clean/GoogleChrome-macOS/App/Chrome-bin/Google Chrome.app"
          /tmp/test-clean/GoogleChrome-macOS/启动Chrome.command --version
          
          echo "=== 5. 验证 0 扩展纯净模式 ==="
          test -d "/tmp/test-clean/GoogleChrome-macOS/Data/UserData"
          echo "🎉 【纯净无插件版 ZIP】解压、安装与启动 100% 成功！"
