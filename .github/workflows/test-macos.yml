name: Test macOS Chrome Portable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-macos-installer:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Package Compliance
        run: |
          chmod +x Chrome-macOS/App/Tools/verify-package.sh
          ./Chrome-macOS/App/Tools/verify-package.sh

      - name: Run Setup and Download Official Chrome DMG
        run: |
          chmod +x Chrome-macOS/一键安装配置.command Chrome-macOS/App/setup-chrome.sh Chrome-macOS/App/launch-chrome.sh Chrome-macOS/App/Tools/*.sh
          ./Chrome-macOS/App/setup-chrome.sh --silent

      - name: Verify Installed Chrome App and Signature
        run: |
          test -d "Chrome-macOS/App/Chrome-bin/Google Chrome.app"
          codesign --verify --deep --strict --verbose=2 "Chrome-macOS/App/Chrome-bin/Google Chrome.app"
          codesign -dv --verbose=4 "Chrome-macOS/App/Chrome-bin/Google Chrome.app" 2>&1 | grep "EQHXZ8M8AV"

      - name: Test Launch Script
        run: |
          # Test execution
          ./Chrome-macOS/App/launch-chrome.sh --version || true

      - name: Test Compliance Report Generation
        run: |
          ./Chrome-macOS/App/Tools/generate-compliance-report.sh
          test -f "合规证明与安全审计报告.html"
